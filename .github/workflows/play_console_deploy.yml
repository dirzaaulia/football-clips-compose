name: Deploy to Play Console

on:
  workflow_dispatch:
    inputs:
      lane:
        description: 'Fastlane Lane to run'
        required: true
        default: 'internal'
        type: choice
        options:
          - internal
          - alpha
          - beta
          - production

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Ruby and Fastlane
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true

      - name: Install Fastlane
        run: gem install fastlane

      - name: Decode Play Console Service Account JSON Key
        run: |
          mkdir -p fastlane
          echo "${{ secrets.PLAY_CONSOLE_JSON_KEY }}" > fastlane/play-console-key.json

      - name: Run Fastlane Lane
        run: bundle exec fastlane android ${{ github.event.inputs.lane }}
        env:
          PLAY_CONSOLE_JSON_KEY: ${{ secrets.PLAY_CONSOLE_JSON_KEY }}
