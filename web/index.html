<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>⚽ Football Clips - Worker Telemetry</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        .mono { font-family: 'JetBrains Mono', monospace; }
        details > summary { list-style: none; }
        details > summary::-webkit-details-marker { display: none; }
        details[open] .arrow-icon { transform: rotate(90deg); }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen">
    <div class="max-w-6xl mx-auto px-4 py-8">
        
        <!-- Header -->
        <header class="flex flex-col md:flex-row md:items-center justify-between pb-6 mb-6 border-b border-slate-800 gap-4">
            <div>
                <div class="flex items-center gap-3">
                    <span class="text-3xl">⚽</span>
                    <div>
                        <h1 class="text-xl font-bold tracking-tight text-white flex items-center gap-2.5">
                            Football Clips Worker Dashboard
                            <span class="inline-flex items-center px-2 py-0.5 rounded-full text-[11px] font-semibold bg-emerald-950 text-emerald-400 border border-emerald-800/80">
                                <span class="w-1.5 h-1.5 rounded-full bg-emerald-400 mr-1.5 animate-pulse"></span> LIVE
                            </span>
                        </h1>
                        <p class="text-xs text-slate-400 mt-1">Zona Waktu: <strong class="text-slate-300">WIB (Asia/Jakarta)</strong> • Standalone Local Telemetry & Auto-Refresh (15s)</p>
                    </div>
                </div>
            </div>
            <div class="flex items-center gap-3">
                <button onclick="fetchLogs()" class="px-3.5 py-2 bg-slate-900 hover:bg-slate-800 text-xs font-semibold rounded-lg border border-slate-700 transition flex items-center gap-2 text-slate-200 shadow-sm active:scale-95">
                    <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg>
                    Refresh Sekarang
                </button>
            </div>
        </header>

        <!-- Filters Bar -->
        <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-4 gap-3 mb-6">
            <div>
                <div class="flex justify-between items-center mb-1">
                    <label class="block text-xs font-semibold text-slate-400">PILIH TANGGAL (WIB)</label>
                    <button onclick="setToday()" class="text-[10px] text-indigo-400 hover:text-indigo-300 underline">Hari Ini</button>
                </div>
                <input type="date" id="dateFilter" onchange="renderLogs()" class="w-full bg-slate-900 border border-slate-800 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-indigo-500 text-slate-200">
            </div>
            <div>
                <label class="block text-xs font-semibold text-slate-400 mb-1">LEVEL STATUS</label>
                <select id="levelFilter" onchange="renderLogs()" class="w-full bg-slate-900 border border-slate-800 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-indigo-500 text-slate-200">
                    <option value="ALL">Semua Status</option>
                    <option value="HIGHLIGHT">🎥 Highlight Ditemukan</option>
                    <option value="GOAL">⚽ Deteksi Gol / Skor</option>
                    <option value="WARN">⚠️ Warning / Limit Quota</option>
                    <option value="ERROR">🚨 Error</option>
                </select>
            </div>
            <div class="sm:col-span-2">
                <label class="block text-xs font-semibold text-slate-400 mb-1">CARI TEKS / KLUB / LIGA</label>
                <input type="text" id="searchFilter" oninput="renderLogs()" placeholder="Contoh: Man City, Coventry, Premier League, LaLiga..." class="w-full bg-slate-900 border border-slate-800 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-indigo-500 text-slate-200">
            </div>
        </div>

        <!-- Metrics Overview -->
        <div class="grid grid-cols-2 sm:grid-cols-4 gap-3 mb-6">
            <div class="bg-slate-900/60 border border-slate-800/80 rounded-lg p-3.5 shadow-sm">
                <div class="text-xs text-slate-400">Total Siklus Tercatat</div>
                <div id="metricTotal" class="text-xl font-bold text-white mt-0.5">0</div>
            </div>
            <div class="bg-slate-900/60 border border-slate-800/80 rounded-lg p-3.5 shadow-sm">
                <div class="text-xs text-emerald-400">Highlight Berhasil</div>
                <div id="metricHighlights" class="text-xl font-bold text-emerald-400 mt-0.5">0</div>
            </div>
            <div class="bg-slate-900/60 border border-slate-800/80 rounded-lg p-3.5 shadow-sm">
                <div class="text-xs text-yellow-400">Event Gol & Status</div>
                <div id="metricGoals" class="text-xl font-bold text-yellow-400 mt-0.5">0</div>
            </div>
            <div class="bg-slate-900/60 border border-slate-800/80 rounded-lg p-3.5 shadow-sm">
                <div class="text-xs text-rose-400">Warning / Error</div>
                <div id="metricErrors" class="text-xl font-bold text-rose-400 mt-0.5">0</div>
            </div>
        </div>

        <!-- Timeline Container -->
        <div id="timelineContainer" class="space-y-5">
            <div class="text-center py-12 text-slate-500 text-sm">Memuat data telemetry...</div>
        </div>

    </div>

    <script>
        let allCycles = [];
        let isFirstLoad = true;

        async function fetchLogs() {
            try {
                const res = await fetch('logs.json?t=' + new Date().getTime());
                if (res.ok) {
                    allCycles = await res.json();
                    
                    const dateInput = document.getElementById('dateFilter');
                    if (isFirstLoad && dateInput) {
                        const todayWIB = new Date().toLocaleDateString('en-CA');
                        dateInput.value = todayWIB;
                        isFirstLoad = false;
                    }
                    
                    renderLogs();
                } else {
                    document.getElementById('timelineContainer').innerHTML = 
                        '<div class="text-center py-12 text-slate-500 text-sm">Belum ada file logs.json yang dihasilkan worker.</div>';
                }
            } catch (err) {
                console.error("Error fetching logs:", err);
            }
        }

        function setToday() {
            const dateInput = document.getElementById('dateFilter');
            if (dateInput) {
                dateInput.value = new Date().toLocaleDateString('en-CA');
                renderLogs();
            }
        }

        function renderLogs() {
            const dateVal = document.getElementById('dateFilter').value;
            const levelVal = document.getElementById('levelFilter').value;
            const searchVal = document.getElementById('searchFilter').value.toLowerCase();

            let totalHl = 0, totalGoals = 0, totalErr = 0;

            allCycles.forEach(c => {
                c.steps.forEach(s => {
                    s.events.forEach(e => {
                        if (e.includes("BERHASIL LINK") || e.includes("🏆 [DAPAT]")) totalHl++;
                        if (e.includes("⚽ [SKOR!]") || e.includes("🔄 [STATUS]") || e.includes("FULL TIME")) totalGoals++;
                        if (e.includes("🚨") || e.includes("⚠️") || e.includes("429")) totalErr++;
                    });
                });
            });

            document.getElementById('metricTotal').innerText = allCycles.length;
            document.getElementById('metricHighlights').innerText = totalHl;
            document.getElementById('metricGoals').innerText = totalGoals;
            document.getElementById('metricErrors').innerText = totalErr;

            const filtered = allCycles.filter(c => {
                if (dateVal && !c.timestamp.startsWith(dateVal)) return false;

                const cycleText = JSON.stringify(c).toLowerCase();
                if (searchVal && !cycleText.includes(searchVal)) return false;

                if (levelVal === "GOAL" && !cycleText.includes("skor!") && !cycleText.includes("status]") && !cycleText.includes("full time")) return false;
                if (levelVal === "HIGHLIGHT" && !cycleText.includes("berhasil link") && !cycleText.includes("dapat]")) return false;
                if (levelVal === "WARN" && !cycleText.includes("quota") && !cycleText.includes("429") && !cycleText.includes("⚠️")) return false;
                if (levelVal === "ERROR" && !cycleText.includes("error") && !cycleText.includes("critical")) return false;

                return true;
            });

            const container = document.getElementById('timelineContainer');
            if (filtered.length === 0) {
                container.innerHTML = '<div class="text-center py-12 text-slate-500 text-sm">Tidak ada log yang cocok dengan filter tanggal / pencarian ini.</div>';
                return;
            }

            container.innerHTML = filtered.map((c, cIdx) => `
                <div class="bg-slate-900/90 border border-slate-800 rounded-xl p-5 shadow-sm">
                    <div class="flex flex-col sm:flex-row sm:items-center justify-between pb-3 mb-4 border-b border-slate-800 gap-2">
                        <div class="flex items-center gap-2.5">
                            <span class="px-2.5 py-0.5 rounded text-xs font-bold ${c.mode.includes('FULL') ? 'bg-indigo-950 text-indigo-300 border border-indigo-800' : 'bg-slate-800 text-slate-300 border border-slate-700'}">
                                ${c.mode}
                            </span>
                            <span class="mono text-xs font-semibold text-slate-300">${c.timestamp}</span>
                        </div>
                        <span class="text-xs text-slate-400">Next Sleep: <strong class="text-slate-200">${c.next_sleep}</strong></span>
                    </div>

                    <div class="space-y-4">
                        ${c.steps.map((s, sIdx) => renderStep(s, `c${cIdx}_s${sIdx}`)).join('')}
                    </div>
                </div>
            `).join('');
        }

        function renderStep(s, uniqueId) {
            const isYouTube = s.title.includes("YouTube");

            if (!isYouTube) {
                // Render Standar Step 1 (Football Data) & Step 3 (Maintenance)
                return `
                    <div class="rounded-lg bg-slate-950/70 p-4 border border-slate-800/80">
                        <div class="text-xs font-bold tracking-wide uppercase text-slate-400 mb-2.5 flex items-center justify-between">
                            <span>${s.title}</span>
                            <span class="text-[10px] px-2 py-0.5 rounded ${s.status === 'OK' ? 'bg-emerald-950 text-emerald-400 border border-emerald-800/80' : 'bg-amber-950 text-amber-400 border border-amber-800/80'}">${s.status}</span>
                        </div>
                        <div class="mono text-xs space-y-1">
                            ${s.events.map(ev => formatEventLine(ev)).join('')}
                        </div>
                    </div>
                `;
            }

            // Render Khusus YouTube & AI Engine dengan Accordion Collapsible per Match
            const parsed = parseYouTubeEvents(s.events);

            return `
                <div class="rounded-lg bg-slate-950/70 p-4 border border-slate-800/80" id="${uniqueId}">
                    <div class="text-xs font-bold tracking-wide uppercase text-slate-400 mb-3 flex items-center justify-between">
                        <div class="flex items-center gap-2">
                            <span>${s.title}</span>
                            ${parsed.matches.length > 0 ? `<span class="text-[11px] font-normal text-slate-400">(${parsed.matches.length} pertandingan)</span>` : ''}
                        </div>
                        <span class="text-[10px] px-2 py-0.5 rounded ${s.status === 'OK' ? 'bg-emerald-950 text-emerald-400 border border-emerald-800/80' : 'bg-amber-950 text-amber-400 border border-amber-800/80'}">${s.status}</span>
                    </div>

                    ${parsed.header.length > 0 ? `
                        <div class="mono text-xs text-slate-300 pb-2 mb-2 border-b border-slate-800/70 leading-relaxed">
                            ${parsed.header.map(h => formatEventLine(h)).join('')}
                        </div>
                    ` : ''}

                    ${parsed.matches.length > 0 ? `
                        <div class="flex items-center justify-between mb-2.5 text-xs text-slate-400">
                            <span class="text-[11px] text-slate-400">Daftar Hasil Pencarian Match:</span>
                            <div class="flex items-center gap-2">
                                <button onclick="toggleAllMatches('${uniqueId}', true)" class="px-2 py-0.5 text-[11px] bg-slate-800 hover:bg-slate-700 text-slate-300 rounded border border-slate-700 transition">Buka Semua</button>
                                <button onclick="toggleAllMatches('${uniqueId}', false)" class="px-2 py-0.5 text-[11px] bg-slate-800 hover:bg-slate-700 text-slate-300 rounded border border-slate-700 transition">Tutup Semua</button>
                            </div>
                        </div>

                        <div class="space-y-2">
                            ${parsed.matches.map(m => renderMatchAccordion(m)).join('')}
                        </div>
                    ` : `
                        <div class="mono text-xs space-y-1">
                            ${s.events.map(ev => formatEventLine(ev)).join('')}
                        </div>
                    `}

                    ${parsed.footer.length > 0 ? `
                        <div class="mono text-xs text-slate-400 pt-2.5 mt-2.5 border-t border-slate-800/70 flex items-center justify-between">
                            ${parsed.footer.map(f => `<span class="text-slate-300 font-semibold">${escapeHtml(f)}</span>`).join('')}
                        </div>
                    ` : ''}
                </div>
            `;
        }

        function parseYouTubeEvents(events) {
            const header = [];
            const matches = [];
            const footer = [];
            let currentMatch = null;
            let matchIndex = 1;

            events.forEach(ev => {
                const trimmed = ev.trim();
                const isFooter = trimmed.startsWith("📊 Ringkasan YouTube");
                const isMatchStart = (
                    trimmed.includes("[PROSES]") || 
                    trimmed.includes("[FORCE MODE]") || 
                    trimmed.includes("[OPPORTUNISTIC HIT]") || 
                    trimmed.includes("[SKIP]") ||
                    trimmed.includes("[SKIP EMBARGO]")
                );

                if (isFooter) {
                    if (currentMatch) {
                        matches.push(currentMatch);
                        currentMatch = null;
                    }
                    footer.push(ev);
                } else if (isMatchStart) {
                    if (currentMatch) {
                        matches.push(currentMatch);
                    }

                    let statusType = "process";
                    let badgeText = "DIPROSES";

                    if (trimmed.includes("[SKIP]") || trimmed.includes("[SKIP EMBARGO]")) {
                        statusType = "skip";
                        badgeText = "DILEWATI";
                    } else if (trimmed.includes("[FORCE MODE]")) {
                        statusType = "force";
                        badgeText = "FORCE SYNC";
                    } else if (trimmed.includes("[OPPORTUNISTIC HIT]")) {
                        statusType = "opp";
                        badgeText = "OPPORTUNISTIC";
                    }

                    // Bersihkan teks judul match
                    let title = trimmed;
                    const matchPattern = /\[(PROSES|FORCE MODE|OPPORTUNISTIC HIT|SKIP|SKIP EMBARGO)\]\s*(.*)/i;
                    const matchResult = trimmed.match(matchPattern);
                    if (matchResult && matchResult[2]) {
                        title = matchResult[2];
                    }
                    title = title.replace(/^Mencari video untuk:\s*/i, '');
                    title = title.replace(/➔ Alasan:.*$/i, '');
                    title = title.replace(/\(Umur Match:.*$/i, '');
                    title = title.replace(/\(Bypass cooldown.*$/i, '');
                    title = title.replace(/:\s*Cooldown.*$/i, '');
                    title = title.trim();

                    currentMatch = {
                        index: matchIndex++,
                        title: title,
                        statusType: statusType,
                        badgeText: badgeText,
                        hasSuccess: false,
                        hasFail: false,
                        events: [ev]
                    };
                } else if (currentMatch) {
                    if (trimmed.includes("✅ [BERHASIL LINK]")) {
                        currentMatch.hasSuccess = true;
                        currentMatch.statusType = "success";
                        currentMatch.badgeText = "BERHASIL LINK";
                    } else if (trimmed.includes("❌ [NIHIL]")) {
                        currentMatch.hasFail = true;
                        if (currentMatch.statusType !== "success") {
                            currentMatch.statusType = "fail";
                            currentMatch.badgeText = "NIHIL";
                        }
                    }
                    currentMatch.events.push(ev);
                } else {
                    header.push(ev);
                }
            });

            if (currentMatch) {
                matches.push(currentMatch);
            }

            return { header, matches, footer };
        }

        function renderMatchAccordion(m) {
            let badgeStyle = "bg-slate-800 text-slate-400 border-slate-700";
            if (m.statusType === "success") {
                badgeStyle = "bg-emerald-950 text-emerald-300 border-emerald-800";
            } else if (m.statusType === "fail") {
                badgeStyle = "bg-amber-950 text-amber-300 border-amber-800";
            } else if (m.statusType === "force" || m.statusType === "opp") {
                badgeStyle = "bg-sky-950 text-sky-300 border-sky-800";
            } else if (m.statusType === "process") {
                badgeStyle = "bg-indigo-950 text-indigo-300 border-indigo-800";
            }

            // Auto-open jika match berhasil mendapatkan video highlight
            const defaultOpen = m.statusType === "success" ? "open" : "";

            return `
                <details ${defaultOpen} class="group match-details bg-slate-900/80 border border-slate-800/90 rounded-lg overflow-hidden transition">
                    <summary class="flex items-center justify-between px-3.5 py-2.5 cursor-pointer select-none hover:bg-slate-800/40 transition">
                        <div class="flex items-center gap-2.5 overflow-hidden pr-2">
                            <span class="text-xs text-slate-500 arrow-icon transition-transform duration-200">▶</span>
                            <span class="text-[10px] font-bold px-2 py-0.5 rounded border ${badgeStyle} flex-shrink-0">
                                ${m.badgeText}
                            </span>
                            <span class="text-xs font-semibold text-slate-200 truncate">
                                ${m.index}. ${escapeHtml(m.title)}
                            </span>
                        </div>
                        <div class="flex items-center gap-2 flex-shrink-0">
                            <span class="text-[10px] font-mono px-1.5 py-0.5 rounded bg-slate-800/80 text-slate-400 border border-slate-700/60">
                                ${m.events.length} langkah
                            </span>
                        </div>
                    </summary>
                    <div class="px-4 py-3 bg-slate-950/90 border-t border-slate-800/80 mono text-xs space-y-1.5 leading-relaxed">
                        ${m.events.map(ev => formatEventLine(ev)).join('')}
                    </div>
                </details>
            `;
        }

        function toggleAllMatches(containerId, expand) {
            const container = document.getElementById(containerId);
            if (!container) return;
            const allDetails = container.querySelectorAll('details.match-details');
            allDetails.forEach(d => {
                if (expand) d.setAttribute('open', '');
                else d.removeAttribute('open');
            });
        }

        function formatEventLine(ev) {
            let color = "text-slate-400";
            if (ev.includes("BERHASIL LINK") || ev.includes("🏆 [DAPAT]")) color = "text-emerald-400 font-semibold";
            else if (ev.includes("⚽ [SKOR!]") || ev.includes("FULL TIME")) color = "text-yellow-300 font-semibold";
            else if (ev.includes("🔄 [STATUS]")) color = "text-cyan-300";
            else if (ev.includes("🚨") || ev.includes("429") || ev.includes("Quota")) color = "text-rose-400 font-semibold";
            else if (ev.includes("⚠️")) color = "text-amber-300";
            else if (ev.includes("AI GEMINI MATCH") || ev.includes("TIER 1 MATCH")) color = "text-indigo-300 font-medium";
            else if (ev.includes("FALLBACK SELECT") || ev.includes("KANDIDAT TIER")) color = "text-sky-300 font-medium";
            else if (ev.includes("SELEKSI AKHIR")) color = "text-teal-300 font-semibold";
            else if (ev.includes("Memeriksa channel")) color = "text-purple-300 font-medium";

            // Otomatis ubah URL YouTube jadi link yang bisa diklik
            let formatted = escapeHtml(ev);
            formatted = formatted.replace(
                /(https?:\/\/(?:www\.)?(?:youtube\.com|youtu\.be)\/[^\s)]+)/g,
                '<a href="$1" target="_blank" rel="noopener" class="text-indigo-400 hover:text-indigo-300 underline font-semibold">$1</a>'
            );

            return `<div class="${color} leading-relaxed">${formatted}</div>`;
        }

        function escapeHtml(text) {
            return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
        }

        fetchLogs();
        setInterval(fetchLogs, 15000);
    </script>
</body>
</html>
