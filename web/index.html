<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>⚽ Football Clips - Worker Telemetry</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        .mono { font-family: 'JetBrains Mono', monospace; }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen">
    <div class="max-w-6xl mx-auto px-4 py-8">
        
        <!-- Header -->
        <header class="flex flex-col md:flex-row md:items-center justify-between pb-6 mb-6 border-b border-slate-800 gap-4">
            <div>
                <div class="flex items-center gap-3">
                    <span class="text-2xl">⚽</span>
                    <h1 class="text-xl font-bold tracking-tight text-white">Football Clips Worker Dashboard</h1>
                    <span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-semibold bg-emerald-950 text-emerald-400 border border-emerald-800">
                        <span class="w-1.5 h-1.5 rounded-full bg-emerald-400 mr-1.5 animate-pulse"></span> LIVE
                    </span>
                </div>
                <p class="text-xs text-slate-400 mt-1">Zona Waktu: <strong class="text-slate-300">WIB (Asia/Jakarta)</strong> • Standalone Local Telemetry & Auto-Refresh (15s)</p>
            </div>
            <div class="flex items-center gap-3">
                <button onclick="fetchLogs()" class="px-3 py-1.5 bg-slate-800 hover:bg-slate-700 text-xs font-semibold rounded-lg border border-slate-700 transition flex items-center gap-2 text-slate-200">
                    <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg>
                    Refresh Sekarang
                </button>
            </div>
        </header>

        <!-- Filters Bar -->
        <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-4 gap-3 mb-6">
            <div>
                <div class="flex justify-between items-center mb-1">
                    <label class="block text-xs font-semibold text-slate-400">PILIH TANGGAL (WIB)</label>
                    <button onclick="setToday()" class="text-[10px] text-indigo-400 hover:text-indigo-300 underline">Hari Ini</button>
                </div>
                <input type="date" id="dateFilter" onchange="renderLogs()" class="w-full bg-slate-900 border border-slate-800 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-indigo-500 text-slate-200">
            </div>
            <div>
                <label class="block text-xs font-semibold text-slate-400 mb-1">LEVEL STATUS</label>
                <select id="levelFilter" onchange="renderLogs()" class="w-full bg-slate-900 border border-slate-800 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-indigo-500 text-slate-200">
                    <option value="ALL">Semua Status</option>
                    <option value="GOAL">⚽ Deteksi Gol</option>
                    <option value="HIGHLIGHT">🎥 Highlight Ditemukan</option>
                    <option value="WARN">⚠️ Warning / Limit Quota</option>
                    <option value="ERROR">🚨 Error</option>
                </select>
            </div>
            <div class="sm:col-span-2">
                <label class="block text-xs font-semibold text-slate-400 mb-1">CARI TEKS / KLUB</label>
                <input type="text" id="searchFilter" oninput="renderLogs()" placeholder="Contoh: Tottenham, Arsenal, Quota..." class="w-full bg-slate-900 border border-slate-800 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-indigo-500 text-slate-200">
            </div>
        </div>

        <!-- Metrics Overview -->
        <div class="grid grid-cols-2 sm:grid-cols-4 gap-3 mb-6">
            <div class="bg-slate-900/60 border border-slate-800/80 rounded-lg p-3">
                <div class="text-xs text-slate-400">Total Siklus Tercatat</div>
                <div id="metricTotal" class="text-lg font-bold text-white mt-0.5">0</div>
            </div>
            <div class="bg-slate-900/60 border border-slate-800/80 rounded-lg p-3">
                <div class="text-xs text-emerald-400">Highlight Berhasil</div>
                <div id="metricHighlights" class="text-lg font-bold text-emerald-400 mt-0.5">0</div>
            </div>
            <div class="bg-slate-900/60 border border-slate-800/80 rounded-lg p-3">
                <div class="text-xs text-yellow-400">Event Gol & Status</div>
                <div id="metricGoals" class="text-lg font-bold text-yellow-400 mt-0.5">0</div>
            </div>
            <div class="bg-slate-900/60 border border-slate-800/80 rounded-lg p-3">
                <div class="text-xs text-rose-400">Warning / Error</div>
                <div id="metricErrors" class="text-lg font-bold text-rose-400 mt-0.5">0</div>
            </div>
        </div>

        <!-- Timeline Container -->
        <div id="timelineContainer" class="space-y-4">
            <div class="text-center py-12 text-slate-500 text-sm">Memuat data telemetry...</div>
        </div>

    </div>

    <script>
        let allCycles = [];
        let isFirstLoad = true;

        async function fetchLogs() {
            try {
                const res = await fetch('logs.json?t=' + new Date().getTime());
                if (res.ok) {
                    allCycles = await res.json();
                    
                    // Set default date ke hari ini hanya saat pertama kali dibuka
                    const dateInput = document.getElementById('dateFilter');
                    if (isFirstLoad && dateInput) {
                        const todayWIB = new Date().toLocaleDateString('en-CA'); // Format YYYY-MM-DD aman zona waktu
                        dateInput.value = todayWIB;
                        isFirstLoad = false;
                    }
                    
                    renderLogs();
                } else {
                    document.getElementById('timelineContainer').innerHTML = 
                        '<div class="text-center py-12 text-slate-500 text-sm">Belum ada file logs.json yang dihasilkan worker.</div>';
                }
            } catch (err) {
                console.error("Error fetching logs:", err);
            }
        }

        function setToday() {
            const dateInput = document.getElementById('dateFilter');
            if (dateInput) {
                dateInput.value = new Date().toLocaleDateString('en-CA');
                renderLogs();
            }
        }

        function renderLogs() {
            const dateVal = document.getElementById('dateFilter').value;
            const levelVal = document.getElementById('levelFilter').value;
            const searchVal = document.getElementById('searchFilter').value.toLowerCase();

            let totalHl = 0, totalGoals = 0, totalErr = 0;

            allCycles.forEach(c => {
                c.steps.forEach(s => {
                    s.events.forEach(e => {
                        if (e.includes("🏆 [DAPAT]")) totalHl++;
                        if (e.includes("⚽ [SKOR!]") || e.includes("🔄 [STATUS]")) totalGoals++;
                        if (e.includes("🚨") || e.includes("⚠️") || e.includes("429")) totalErr++;
                    });
                });
            });

            document.getElementById('metricTotal').innerText = allCycles.length;
            document.getElementById('metricHighlights').innerText = totalHl;
            document.getElementById('metricGoals').innerText = totalGoals;
            document.getElementById('metricErrors').innerText = totalErr;

            const filtered = allCycles.filter(c => {
                if (dateVal && !c.timestamp.startsWith(dateVal)) return false;

                const cycleText = JSON.stringify(c).toLowerCase();
                
                if (searchVal && !cycleText.includes(searchVal)) return false;

                if (levelVal === "GOAL" && !cycleText.includes("skor!") && !cycleText.includes("status]")) return false;
                if (levelVal === "HIGHLIGHT" && !cycleText.includes("dapat]")) return false;
                if (levelVal === "WARN" && !cycleText.includes("quota") && !cycleText.includes("429") && !cycleText.includes("⚠️")) return false;
                if (levelVal === "ERROR" && !cycleText.includes("error") && !cycleText.includes("critical")) return false;

                return true;
            });

            const container = document.getElementById('timelineContainer');
            if (filtered.length === 0) {
                container.innerHTML = '<div class="text-center py-12 text-slate-500 text-sm">Tidak ada log yang cocok dengan filter tanggal/kata kunci ini.</div>';
                return;
            }

            container.innerHTML = filtered.map((c, idx) => `
                <div class="bg-slate-900 border border-slate-800 rounded-xl p-5 shadow-sm">
                    <div class="flex flex-col sm:flex-row sm:items-center justify-between pb-3 mb-4 border-b border-slate-800/80 gap-2">
                        <div class="flex items-center gap-2.5">
                            <span class="px-2 py-0.5 rounded text-xs font-bold ${c.mode.includes('FULL') ? 'bg-indigo-950 text-indigo-300 border border-indigo-800' : 'bg-slate-800 text-slate-300'}">
                                ${c.mode}
                            </span>
                            <span class="mono text-xs font-semibold text-slate-300">${c.timestamp}</span>
                        </div>
                        <span class="text-xs text-slate-400">Sleep: <strong class="text-slate-200">${c.next_sleep}</strong></span>
                    </div>

                    <div class="space-y-4">
                        ${c.steps.map(s => `
                            <div class="rounded-lg bg-slate-950/60 p-3.5 border border-slate-800/60">
                                <div class="text-xs font-bold tracking-wide uppercase text-slate-400 mb-2 flex items-center justify-between">
                                    <span>${s.title}</span>
                                    <span class="text-[10px] px-2 py-0.5 rounded ${s.status === 'OK' ? 'bg-emerald-950 text-emerald-400' : 'bg-amber-950 text-amber-400'}">${s.status}</span>
                                </div>
                                <div class="mono text-xs space-y-1">
                                    ${s.events.map(ev => formatEventLine(ev)).join('')}
                                </div>
                            </div>
                        `).join('')}
                    </div>
                </div>
            `).join('');
        }

        function formatEventLine(ev) {
            let color = "text-slate-400";
            if (ev.includes("🏆 [DAPAT]")) color = "text-emerald-400 font-semibold";
            else if (ev.includes("⚽ [SKOR!]")) color = "text-yellow-300 font-semibold";
            else if (ev.includes("🔄 [STATUS]")) color = "text-cyan-300";
            else if (ev.includes("🚨") || ev.includes("429") || ev.includes("Quota")) color = "text-rose-400";
            else if (ev.includes("⚠️")) color = "text-amber-300";
            else if (ev.includes("✅")) color = "text-emerald-300";

            return `<div class="${color} leading-relaxed">${escapeHtml(ev)}</div>`;
        }

        function escapeHtml(text) {
            return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
        }

        fetchLogs();
        setInterval(fetchLogs, 15000);
    </script>
</body>
</html>
