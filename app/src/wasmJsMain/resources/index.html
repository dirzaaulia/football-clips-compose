<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Football Highlights & Clips - Official Match Highlights, Scores & Schedules</title>
    <meta name="description" content="Watch verified football match highlights, live scores, fixtures, and standings for Premier League, UEFA Champions League, La Liga, Serie A, and Bundesliga.">
    <!-- Favicon & Touch Icons -->
    <link rel="icon" type="image/x-icon" href="favicon.ico">
    <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="192x192" href="favicon.png">
    <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- YouTube IFrame Player API -->
    <script src="https://www.youtube.com/iframe_api"></script>
    
    <!-- AdSense Verification Meta Tag -->
    <meta name="google-adsense-account" content="ca-pub-6717632447198427">
    
    <!-- Google AdSense - Global Script -->
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-6717632447198427" crossorigin="anonymous"></script>

    <style>
        :root {
            --bg-color: #0b0f17;
            --surface-color: #131b2a;
            --surface-border: #1e293b;
            --primary: #38bdf8;
            --accent: #10b981;
            --text-main: #f1f5f9;
            --text-muted: #94a3b8;
            --text-dim: #64748b;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html, body {
            width: 100vw;
            height: 100vh;
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        /* Sleek Loading Splash Screen */
        #app-splash {
            position: fixed;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background-color: var(--bg-color);
            z-index: 50;
            transition: opacity 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            user-select: none;
        }

        .splash-card {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            padding: 2rem;
        }

        .splash-logo {
            width: 72px;
            height: 72px;
            margin-bottom: 1.25rem;
            border-radius: 20px;
            box-shadow: 0 0 35px rgba(56, 189, 248, 0.25);
            animation: pulse-glow 2.4s ease-in-out infinite alternate;
        }

        .splash-title {
            font-size: 1.4rem;
            font-weight: 800;
            letter-spacing: -0.02em;
            color: #ffffff;
            margin-bottom: 0.35rem;
        }

        .splash-subtitle {
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-bottom: 1.75rem;
        }

        /* Modern Indeterminate Progress Line */
        .progress-bar {
            width: 180px;
            height: 3px;
            background: rgba(255, 255, 255, 0.08);
            border-radius: 999px;
            overflow: hidden;
            position: relative;
        }

        .progress-bar::after {
            content: '';
            position: absolute;
            top: 0;
            left: -50%;
            width: 50%;
            height: 100%;
            background: linear-gradient(90deg, transparent, var(--primary), transparent);
            border-radius: 999px;
            animation: indeterminate 1.5s infinite ease-in-out;
        }

        /* Crawlable Navigation Bar for Search Engines & Crawlers */
        .crawler-nav {
            position: absolute;
            bottom: 1.5rem;
            font-size: 0.775rem;
            color: var(--text-dim);
            text-align: center;
            display: flex;
            gap: 0.85rem;
            flex-wrap: wrap;
            justify-content: center;
        }

        .crawler-nav a {
            color: var(--text-muted);
            text-decoration: none;
            transition: color 0.2s ease;
        }

        .crawler-nav a:hover {
            color: var(--primary);
        }

        @keyframes pulse-glow {
            0% {
                transform: scale(0.97);
                box-shadow: 0 0 20px rgba(56, 189, 248, 0.15);
            }
            100% {
                transform: scale(1.03);
                box-shadow: 0 0 40px rgba(56, 189, 248, 0.4);
            }
        }

        @keyframes indeterminate {
            0% { left: -50%; width: 40%; }
            50% { left: 30%; width: 60%; }
            100% { left: 110%; width: 40%; }
        }
    </style>
</head>
<body>
    <!-- Sleek Native-Style Splash Loader -->
    <div id="app-splash">
        <div class="splash-card">
            <img src="favicon.png" alt="Football Highlights & Clips" class="splash-logo">
            <h1 class="splash-title">Football Highlights & Clips</h1>
            <p class="splash-subtitle">Loading official highlights, scores & schedules...</p>
            <div class="progress-bar"></div>
        </div>

        <!-- Crawlable Directory Links for AdSense & Googlebot -->
        <nav class="crawler-nav" aria-label="Quick Links">
            <a href="/competitions">Competitions</a>
            <span>&bull;</span>
            <a href="/about">About</a>
            <span>&bull;</span>
            <a href="/contact">Contact</a>
            <span>&bull;</span>
            <a href="/privacy">Privacy Policy</a>
            <span>&bull;</span>
            <a href="/tnc">Terms</a>
        </nav>
    </div>

    <!-- Script to smoothly transition from splash to WASM canvas -->
    <script>
        const splashObserver = new MutationObserver((mutations) => {
            for (const m of mutations) {
                for (const node of m.addedNodes) {
                    if (node.tagName === 'CANVAS') {
                        const splash = document.getElementById('app-splash');
                        if (splash) {
                            splash.style.opacity = '0';
                            setTimeout(() => splash.remove(), 400);
                        }
                        splashObserver.disconnect();
                        return;
                    }
                }
            }
        });
        splashObserver.observe(document.body, { childList: true });
    </script>

    <!-- Compose Multiplatform WebAssembly Bundle -->
    <script src="composeApp.js"></script>
</body>
</html>
